<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1a33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Advent">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="En adventskalender med en lucka om dagen.">
  <title>Adventskalender</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/scenes.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <!-- Decoration only: everything in .scene sits behind the content and ignores taps. -->
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>
  </div>
  <div id="garland" class="garland" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>
  <!-- Today's day scene, small, on the snow behind the doors (js/scenes.js). -->
  <div id="home-scene" class="home-scene" aria-hidden="true"></div>

  <main id="app" class="app" aria-busy="true">
    <header id="header" class="app-header">
      <div class="title-wrap">
        <svg class="santa-hat" viewBox="0 0 80 64" aria-hidden="true" focusable="false">
          <path class="hat-body" d="M9 47C12 25 28 8 48 6c10-1 18 5 21 15-6-5-11-5-14 0-3 6-1 16 3 26z"/>
          <path class="hat-shade" d="M48 6c10-1 18 5 21 15-6-5-11-5-14 0-3 6-1 16 3 26H46c-4-12-3-30 2-41z"/>
          <g class="hat-ball">
            <circle cx="70" cy="27" r="7"/>
          </g>
          <rect class="hat-fur" x="3" y="43" width="60" height="15" rx="7.5"/>
        </svg>
        <h1 id="title" class="app-title">Adventskalender</h1>
      </div>
      <p id="subtitle" class="app-subtitle"></p>
    </header>

    <p id="loading" class="status-message">Laddar kalendern…</p>

    <section id="error" class="status-message error" hidden>
      <p class="error-title">Hoppsan! Kalendern kunde inte laddas.</p>
      <p>Kontrollera uppkopplingen och försök igen om en stund.</p>
      <button id="retry" type="button" class="btn btn-primary">Försök igen</button>
    </section>

    <section id="special" class="special" aria-label="Specialluckor" hidden></section>
    <section id="grid" class="grid" aria-label="Luckor" hidden></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="card" class="card" aria-labelledby="card-title">
    <div class="card-inner">
      <p class="card-meta"><span id="card-icon" class="card-icon" aria-hidden="true"></span><span id="card-date"></span></p>
      <h2 id="card-title" class="card-title"></h2>
      <div id="card-verse" class="card-verse" hidden></div>
      <div id="card-body" class="card-body"></div>
      <div class="card-actions">
        <button id="card-alt" type="button" class="btn btn-secondary" hidden></button>
        <form method="dialog"><button class="btn btn-primary">Stäng</button></form>
      </div>
    </div>
  </dialog>
</body>
</html>
